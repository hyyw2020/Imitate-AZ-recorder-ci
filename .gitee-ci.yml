# Gitee CI/CD - Auto Build APK
# 每次 push 自动构建 APK 并发布 Release
name: build-apk

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug, OU=Dev, O=GiteeCI, L=Unknown, ST=Unknown, C=CN" 2>/dev/null || true
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore -storepass android \
            build/outputs/apk/release/app-release-unsigned.apk debug
          mv build/outputs/apk/release/app-release-unsigned.apk \
            build/outputs/apk/release/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/outputs/apk/release/app-release.apk

      - name: Create Gitee Release
        run: |
          TAG="v$(date +'%Y%m%d-%H%M')"
          curl -X POST \
            "https://gitee.com/api/v5/repos/nlxxai/Imitate-AZ-screen-recorder/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${{ secrets.GITEE_TOKEN }}\",\"tag_name\":\"$TAG\",\"name\":\"CI Build $TAG\",\"body\":\"Auto-built by Gitee CI\"}"
